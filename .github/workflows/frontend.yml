name: Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar e gerar o site
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
        run: |
          npm ci
          npm run build

  deploy:
    name: Build e publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar e gerar o site
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
        run: |
          if [ -z "$VITE_API_BASE" ] || [ -z "$VITE_COGNITO_CLIENT_ID" ]; then
            echo "Defina VITE_API_BASE e VITE_COGNITO_CLIENT_ID no environment production."
            exit 1
          fi
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Enviar o site para o S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "Defina S3_BUCKET no environment production."
            exit 1
          fi
          aws s3 sync web/dist "s3://${S3_BUCKET}" --delete
